<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: linear-gradient(135deg, #fff7e6, #ffe3f3);
      text-align: center;
      padding: 20px 15px;
      color: #333;
    }
    h2 { font-size: 26px; color: #d9539f; margin-bottom: 10px; }
    .class-label { font-size: 24px; font-weight: bold; color: #ff6fa8; margin-bottom: 20px; }
    .input-area { margin: 15px auto; width: 100%; max-width: 300px; text-align: left; }
    .input-area label { font-size: 16px; font-weight: 600; color: #555; }
    .input-area input, .input-area textarea {
      width: 100%; padding: 12px; font-size: 16px; margin-top: 5px;
      border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box;
      font-family: inherit;
    }
    .input-area textarea { height: 80px; resize: vertical; }
    .btn {
      width: 100%; max-width: 300px; height: 60px; font-size: 20px; font-weight: bold;
      margin: 10px auto; border-radius: 12px; border: none; cursor: pointer;
      display: block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty { background: #a8f0c6; }
    .normal { background: #ffe08a; }
    .crowded { background: #ff9e9e; }
    .loading { display: none; margin-top: 20px; font-size: 18px; color: #ff6fa8; font-weight: bold; }
    .spinner {
      margin: 10px auto; width: 30px; height: 30px;
      border: 4px solid #ffd1e8; border-top-color: #ff6fa8;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .current-status { margin-top: 15px; font-size: 16px; font-weight: 600; color: #555; }
  </style>
</head>
<body>

  <h2>混雑状況 更新</h2>
  <div class="class-label">クラス：<?= className ?></div>

  <div class="input-area">
    <label for="waitTime">待ち時間（分）</label>
    <input id="waitTime" type="number" min="0" placeholder="0">
  </div>

  <div class="input-area">
    <label for="detail">詳細・お知らせ</label>
    <textarea id="detail" placeholder="例：整理券配布中、出し物の案内など"></textarea>
  </div>

  <button class="btn empty" onclick="update('空いている')">空いている</button>
  <button class="btn normal" onclick="update('普通')">普通</button>
  <button class="btn crowded" onclick="update('混んでいる')">混んでいる</button>

  <div class="current-status" id="currentStatus"></div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    送信中…
  </div>

  <script>
    const className = "<?= className ?>";
    const requestKey = "<?= requestKey ?>";

    function setButtonsDisabled(disabled) {
      document.querySelectorAll('.btn').forEach(btn => btn.disabled = disabled);
    }

    function update(status) {
      const waitInput = document.getElementById("waitTime");
      const detailInput = document.getElementById("detail");

      let wait = parseInt(waitInput.value, 10);
      if (isNaN(wait) || wait < 0) wait = 0;
      const detail = detailInput.value.trim();

      document.getElementById("currentStatus").textContent = `送信中： ${status}（待ち時間 ${wait}分）`;
      document.getElementById("loading").style.display = "block";
      
      setButtonsDisabled(true);

      google.script.run
        .withSuccessHandler(() => {
          document.getElementById("loading").style.display = "none";
          document.getElementById("currentStatus").textContent = `更新完了： ${status}（待ち時間 ${wait}分）`;
          setButtonsDisabled(false);
        })
        .withFailureHandler((err) => {
          document.getElementById("loading").style.display = "none";
          alert("送信に失敗しました: " + err);
          setButtonsDisabled(false);
        })
        .sendStatusByKey(requestKey, status, wait, detail);
    }
  </script>

</body>
</html>
