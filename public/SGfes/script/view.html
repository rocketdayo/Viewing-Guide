<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      padding: 15px;
      background: linear-gradient(135deg, #fff7e6, #ffe3f3);
      color: #333;
    }
    h2 { text-align: center; font-size: 28px; color: #d9539f; margin-bottom: 15px; }
    .block {
      padding: 15px; margin-bottom: 20px; border-radius: 12px;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    h3 {
      font-size: 22px; margin: 0 0 10px 0; color: #ff6fa8;
      border-left: 5px solid #ff6fa8; padding-left: 8px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .item {
      padding: 10px; border-radius: 8px; background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .class-name { font-weight: bold; font-size: 18px; }
    .status { font-weight: bold; font-size: 16px; margin: 4px 0; }
    .wait { font-size: 14px; color: #666; }
    .detail { font-size: 12px; color: #888; margin-top: 6px; border-top: 1px dashed #eee; padding-top: 4px; word-break: break-all; }
    
    .empty { color: #27ae60; }
    .normal { color: #f39c12; }
    .crowded { color: #e74c3c; }
  </style>
</head>
<body>

<h2>各クラス混雑状況</h2>

<div id="year1" class="block">
  <h3>1年</h3>
  <div class="grid-container">
    <? for (let c of ["1A","1B","1C","1D","1E","1F","1G","1H","1I","1J"]) { ?>
      <div class="item" id="item-<?= c ?>">
        <div class="class-name"><?= c ?></div>
        <div class="status <?= (data[c] && data[c].status.includes('空')) ? 'empty' : (data[c] && data[c].status.includes('混')) ? 'crowded' : 'normal' ?>">
          <?= data[c] ? data[c].status : '未設定' ?>
        </div>
        <div class="wait">待ち: <?= data[c] ? data[c].wait : 0 ?>分</div>
        <div class="detail"><?= (data[c] && data[c].detail) ? data[c].detail : '' ?></div>
      </div>
    <? } ?>
  </div>
</div>

<div id="year2" class="block">
  <h3>2年</h3>
  <div class="grid-container">
    <? for (let c of ["2A","2B","2C","2D","2E","2F","2G","2H","2I","2J","2K"]) { ?>
      <div class="item" id="item-<?= c ?>">
        <div class="class-name"><?= c ?></div>
        <div class="status <?= (data[c] && data[c].status.includes('空')) ? 'empty' : (data[c] && data[c].status.includes('混')) ? 'crowded' : 'normal' ?>">
          <?= data[c] ? data[c].status : '未設定' ?>
        </div>
        <div class="wait">待ち: <?= data[c] ? data[c].wait : 0 ?>分</div>
        <div class="detail"><?= (data[c] && data[c].detail) ? data[c].detail : '' ?></div>
      </div>
    <? } ?>
  </div>
</div>

<script>
  function updateUI(data) {
    Object.keys(data).forEach(c => {
      const item = document.getElementById("item-" + c);
      if (!item) return;

      const statusEl = item.querySelector(".status");
      const waitEl = item.querySelector(".wait");
      const detailEl = item.querySelector(".detail");

      const statusText = data[c].status || "未設定";
      const waitVal = data[c].wait ?? 0;
      const detailText = data[c].detail || "";

      statusEl.textContent = statusText;
      waitEl.textContent = `待ち: ${waitVal}分`;
      detailEl.textContent = detailText;

      statusEl.className = "status";
      if (statusText.includes("空")) statusEl.classList.add("empty");
      else if (statusText.includes("混")) statusEl.classList.add("crowded");
      else statusEl.classList.add("normal");
    });
  }

  function fetchStatus() {
    google.script.run
      .withSuccessHandler(updateUI)
      .getStatusAll();
  }

  setInterval(fetchStatus, 10000);
</script>

</body>
</html>
